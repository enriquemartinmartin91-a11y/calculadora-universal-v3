<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIVERSAL V4</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:monospace;padding:20px;max-width:700px;margin:auto}
.card{background:#1e1e1e;border-radius:20px;padding:20px}
input{width:100%;padding:16px;border-radius:12px;border:none;font-size:16px;box-sizing:border-box}
button{width:100%;background:#00ff88;color:#000;padding:16px;border-radius:12px;border:none;font-size:18px;font-weight:bold;margin-top:12px;cursor:pointer}
.res{background:#000;border-radius:15px;padding:16px;margin-top:15px;white-space:pre-wrap;border-left:4px solid #00ff88}
#avatar{width:130px;height:130px;border-radius:50%;object-fit:cover;border:3px solid #ffcc00;transition:all 0.3s ease;background:#fff}
.avatar-box{text-align:center;margin-bottom:15px}
#mensaje-perrita{font-size:14px;margin-top:8px;min-height:20px}
.ejemplos{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.ejemplos button{width:auto;background:#2a2a2a;color:#00ff88;padding:8px 12px;font-size:12px;margin:0;border:1px solid #333}
</style>
</head>
<body>
<h2 style="text-align:center">🧠 UNIVERSAL V4</h2>

<div class="card">
  <div class="avatar-box">
    <img id="avatar" src="./assets/perrita-dudosa.png" alt="Perrita">
    <p id="mensaje-perrita">¿Qué calculamos hoy? 🐾</p>
  </div>

  <input id="in" placeholder="Ej: 500L 5ml / 80, 5+8, Pepito tiene 5 y da 3...">
  <button onclick="go()">EJECUTAR</button>

  <div class="ejemplos">
    <button onclick="probar('500L 5ml / 80')">500L 5ml / 80</button>
    <button onclick="probar('5+8')">5+8</button>
    <button onclick="probar('Pepito tiene 5 manzanas y le da 3 a Juan, ¿cuántas le quedan?')">Pepito 🍎</button>
    <button onclick="probar('Maria tiene 10 pesos y gasta 4, ¿cuánto le queda?')">María 💸</button>
    <button onclick="probar('Juan reparte 20 dulces entre 4 niños')">Repartir 🍬</button>
  </div>

  <div id="out" class="res">Esperando...</div>
  <div id="log" style="font-size:11px;color:#00ff88;margin-top:10px;white-space:pre-wrap"></div>
</div>

<script type="module">
import { runOrchestrator } from './core/orchestrator.js';

function setAvatar(estado, mensaje){
  const img = document.getElementById("avatar");
  const texto = document.getElementById("mensaje-perrita");
  const out = document.getElementById("out");
  if(estado === "feliz"){
    img.src = "./assets/perrita-feliz.png";
    img.style.borderColor = "#00ff88";
    out.style.borderLeftColor = "#00ff88";
    texto.textContent = mensaje || "¡Eso! ¡Muy bien! 🥳";
  }
  if(estado === "triste"){
    img.src = "./assets/perrita-triste.png";
    img.style.borderColor = "#ff4444";
    out.style.borderLeftColor = "#ff4444";
    texto.textContent = mensaje || "Ay no... eso no me salió 😢 ¿Lo intentamos de nuevo?";
  }
  if(estado === "pensando"){
    img.src = "./assets/perrita-dudosa.png";
    img.style.borderColor = "#ffcc00";
    out.style.borderLeftColor = "#ffcc00";
    texto.textContent = mensaje || "Mmm... déjame pensar 🤔";
  }
}

// Para que los botones de ejemplo funcionen
window.probar = (txt) => {
  document.getElementById('in').value = txt;
  go();
};

window.go = async function(){
  let raw = document.getElementById('in').value;
  if(!raw.trim()){
    setAvatar("triste", "Escríbeme algo primero 🐾");
    return;
  }
  setAvatar("pensando", "Mmm... déjame pensar 🤔");
  document.getElementById('out').textContent = "Calculando...";
  document.getElementById('log').textContent = "";

  try{
    // V4: YA NO CALCULA AQUI. Le pasa todo al cerebro universal.
    const res = await runOrchestrator(raw);
    console.log("V4:", res);

    const esError = !res.resultado || res.resultado.includes("No pude resolverlo");
    if(esError){
      setAvatar("triste", "Ay no... eso no me salió 😢 ¿Me lo dices de otra forma?");
      document.getElementById('out').textContent = res.resultado;
    } else {
      // Mensaje bonito segun intent
      let msg = "¡Listo! ¡Te salió perfecto! 🥳";
      if(res.intent === "dosis") msg = "¡Listo! Tu acuario queda perfecto 🐠";
      if(res.intent === "problema_universal") msg = "¡Listo! Ya entendí tu problema 🧠";
      if(res.intent === "calculadora") msg = "¡Listo! Cuenta hecha ⚡";
      setAvatar("feliz", msg);
      document.getElementById('out').textContent = res.resultado;
    }
    document.getElementById('log').textContent = res.log || "";
  }catch(e){
    console.error(e);
    setAvatar("triste", "Ay no... me trabé 😢");
    document.getElementById('out').textContent = "Error: " + e.message + "\n\nRevisa que tus archivos V4 estén en su carpeta core/ y que lo abras con Live Server, no con doble clic.";
  }
};

// Enter también ejecuta
document.getElementById('in').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') go();
});
</script>
</body>
</html>
