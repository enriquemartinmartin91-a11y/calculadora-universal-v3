<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>UNIVERSAL V3</title><style>body{background:#0a0a0a;color:#fff;font-family:monospace;padding:20px;max-width:700px;margin:auto}.card{background:#1e1e1e;border-radius:20px;padding:20px}input{width:100%;padding:16px;border-radius:12px;border:none;font-size:16px}button{width:100%;background:#00ff88;color:#000;padding:16px;border-radius:12px;border:none;font-size:18px;font-weight:bold;margin-top:12px} .res{background:#000;border-radius:15px;padding:16px;margin-top:15px;white-space:pre-wrap;border-left:4px solid #00ff88}</style></head><body><h2>🧠 UNIVERSAL V3 - SELF HEALING</h2><div class="card"><input id="in" placeholder="Ej: 500L 5ml / 80 o quinientos litros..."><button onclick="go()">EJECUTAR</button><div id="out" class="res"></div><div id="log" style="font-size:11px;color:#00ff88;margin-top:10px"></div></div><script type="module">import{runOrchestrator}from'./core/orchestrator.js';window.go=async()=>{let r=document.getElementById('in').value;let {result,log}=await runOrchestrator(r);document.getElementById('out').textContent=result;document.getElementById('log').textContent=log;}</script></body></html>
