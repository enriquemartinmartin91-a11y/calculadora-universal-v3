<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIVERSAL V3</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:20px}
.card{background:#1a1a1a;border-radius:20px;padding:20px;max-width:400px;margin:auto}
img{width:150px;height:150px;border-radius:50%;border:4px solid gold;object-fit:cover}
input{width:90%;padding:15px;border-radius:12px;border:none;font-size:18px;margin:10px 0}
button{width:95%;padding:15px;border-radius:12px;border:none;background:#00ff88;font-size:22px;font-weight:bold;cursor:pointer}
#resultado{background:#000;border-left:5px solid #00ff88;border-radius:12px;padding:15px;margin-top:15px;text-align:left;font-family:monospace;white-space:pre-wrap}
</style>
</head>
<body>
<h2>🧠 UNIVERSAL V3</h2>
<div class="card">
<img id="perrita" src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="perrita">
<p>¿Qué calculamos hoy? 🐾</p>
<input id="entrada" placeholder="Ej: 500L 5ml / 80">
<button onclick="calcular()">EJECUTAR</button>
<div id="resultado">Esperando...</div>
</div>

<script>
const img = document.getElementById('perrita');
const feliz = "https://cdn-icons-png.flaticon.com/512/616/616408.png";
const dudosa = "https://cdn-icons-png.flaticon.com/512/616/616408.png";
const triste = "https://cdn-icons-png.flaticon.com/512/616/616408.png";

function calcular(){
  const texto = document.getElementById('entrada').value.toLowerCase();
  const res = document.getElementById('resultado');
  
  // Poner dudosa mientras piensa
  img.style.borderColor = "orange";

  if(!texto.trim()){
    res.innerText = "Escribe algo primero...";
    img.style.borderColor = "red";
    return;
  }

  // Sacar todos los números
  const nums = texto.match(/[\d.]+/g);
  if(!nums || nums.length < 2){
    res.innerText = "No entendí 😢\nPrueba: 500L 5ml / 80";
    img.style.borderColor = "red";
    return;
  }

  // Ejemplo: 500L 5ml / 80 -> 500 litros, dosis 5ml, entre 80
  let litros = parseFloat(nums[0]);
  let dosis = parseFloat(nums[1]);
  let divisor = nums[2] ? parseFloat(nums[2]) : 1;

  let totalMl = litros * 1000;
  let totalDosis = totalMl / dosis;
  let final = totalDosis / divisor;

  res.innerText = "¡Listo! 🥳\n\n" +
    "Total: " + totalMl + " ml\n" +
    "Dosis de " + dosis + " ml = " + totalDosis.toLocaleString() + " dosis\n" +
    "Entre " + divisor + " = " + final.toLocaleString() + " por grupo";

  img.style.borderColor = "#00ff88";
}
</script>
</body>
</html>
